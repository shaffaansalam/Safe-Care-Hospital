<!DOCTYPE html>
<html>
<head>
    <title>Search Doctors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="home.css">

</head>
<body class="bg-gray-100">

    <header class="navbar fixed-top px-5">
<div class="left-logo">SAFE CARE<div class="down">Hospital</div></div>
<nav>
<ul class="nav-links">
<li><a href="home.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="{% url 'departments' %}">Departments</a></li>
<li><a href="{% url 'contact' %}">Contact</a></li>
<li><a href="patient-booking.html">Booking</a></li>
<li><a href="search-booking.html">Find Doctors</a></li>

<li id="loginNav">
  <a href="{% url 'login-page' %}">Login</a>

</li>

<li id="logoutNav" style="display:none;">
  <a href="#" onclick="logoutUser()">Logout</a>
</li>

<li>
  <a href="{% url 'authentication:register' %}" 
     class="btn btn-primary btn-sm text-white text-sm">
     Register
  </a>
</li>
</ul>

</nav>
</header>
<div class="navbar-space"></div>



<div class="max-w-4xl mx-auto mt-10">

    <h1 class="text-3xl font-bold mb-6">
        Search Doctors
    </h1>

    <input
        type="text"
        id="specialization"
        placeholder="Enter specialization"
        class="w-full p-3 border rounded-lg"
    >

    <button
        onclick="searchDoctors()"
        class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg"
    >
        Search
    </button>

    <div id="doctorList" class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6"></div>

</div>

<script>

async function searchDoctors() {

    const specialization =
        document.getElementById("specialization").value;

    const response = await fetch(
        `http://127.0.0.1:8001/auth/doctors/search/?specialization=${specialization}`
    );

    const data = await response.json();

    let html = "";

    data.doctors.forEach(doctor => {

        html += `
        <div class="bg-white p-6 rounded-xl shadow">

            <h2 class="text-xl font-bold">
                ${doctor.user.name}
            </h2>

            <p>${doctor.specialization}</p>

            <p>${doctor.qualification}</p>

            <p>₹${doctor.consultation_fee}</p>

        </div>
        `;
    });

    document.getElementById("doctorList").innerHTML = html;
}

</script>

</body>
</html>
