<!DOCTYPE html>
<html>
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="home.css">

</head>

<body class="bg-gray-100">

<!-- ========================================= -->
<!-- NAVBAR -->
<!-- ========================================= -->

<header class="navbar fixed-top px-5">

    <div class="left-logo">
        SAFE CARE
        <div class="down">Hospital</div>
    </div>

    <nav>

        <ul class="nav-links">

            <li><a href="home.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="{% url 'departments' %}">Departments</a></li>

            <li><a href="{% url 'contact' %}">Contact</a></li>

            <li><a href="patient-booking.html">Booking</a></li>

            <li id="loginNav">
                <a href="{% url 'login-page' %}">
                    Login
                </a>
            </li>

            <li id="logoutNav" style="display:none;">
                <a href="#" onclick="logoutUser()">
                    Logout
                </a>
            </li>

            <li>
                <a href="{% url 'authentication:register' %}"
                class="btn btn-primary btn-sm text-white text-sm">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>

<div class="navbar-space"></div>


<!-- ========================================= -->
<!-- BOOKING CARD -->
<!-- ========================================= -->

<div class="max-w-xl mx-auto mt-20 bg-white p-6 rounded-xl shadow-lg">

    <h2 class="text-3xl font-bold mb-6">
        Book Appointment
    </h2>

    <form id="bookingForm" class="space-y-4">

        <!-- DEPARTMENT -->

        <select id="department"
            class="w-full p-3 border rounded-lg">

            <option value="">
                Select Department
            </option>

        </select>


        <!-- DOCTOR -->

        <select id="doctor"
            class="w-full p-3 border rounded-lg">

            <option value="">
                Select Doctor
            </option>

        </select>


        <!-- DATE -->

        <input
            type="date"
            id="date"
            class="w-full p-3 border rounded-lg"
        >


        <!-- TIME SLOT -->

        <select id="time"
            class="w-full p-3 border rounded-lg">

            <option value="">
                Select Time Slot
            </option>

        </select>


        <!-- REASON -->

        <textarea
            id="reason"
            placeholder="Reason for consultation"
            class="w-full p-3 border rounded-lg"
        ></textarea>


        <!-- BUTTON -->

        <button
            type="submit"
            class="bg-blue-600 text-white w-full py-3 rounded-lg hover:bg-blue-700">

            Book Appointment

        </button>

    </form>


    <!-- NORMAL MESSAGE -->

    <p id="message"
       class="mt-4 text-green-600 font-semibold">
    </p>

</div>



<!-- ========================================= -->
<!-- TOAST POPUP -->
<!-- ========================================= -->

<div id="toast"

     class="fixed top-5 right-5 hidden px-6 py-4 rounded-lg shadow-lg text-white font-semibold z-50">

</div>



<!-- ========================================= -->
<!-- SCRIPT -->
<!-- ========================================= -->

<script>

// ======================================
// TOKEN
// ======================================

const token =
    localStorage.getItem("access_token");

console.log("TOKEN:", token);


// ======================================
// TOAST FUNCTION
// ======================================

function showToast(message, type="success") {

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.classList.remove(
        "hidden",
        "bg-green-600",
        "bg-red-600"
    );

    if (type === "success") {

        toast.classList.add("bg-green-600");
    }

    else {

        toast.classList.add("bg-red-600");
    }

    toast.classList.remove("hidden");

    setTimeout(() => {

        toast.classList.add("hidden");

    }, 3000);
}



// ======================================
// LOAD DEPARTMENTS
// ======================================

async function loadDepartments() {

    try {

        const response = await fetch(
            "http://127.0.0.1:8001/auth/departments/dropdown/"
        );

        const data = await response.json();

        console.log("DEPARTMENTS:", data);

        const departmentSelect =
            document.getElementById("department");

        departmentSelect.innerHTML = `
            <option value="">
                Select Department
            </option>
        `;

        data.forEach(dept => {

            const option =
                document.createElement("option");

            option.value = dept.id;

            option.text = dept.name;

            departmentSelect.appendChild(option);
        });

    }

    catch(error) {

        console.log("Department Error:", error);
    }
}

loadDepartments();



// ======================================
// LOAD DOCTORS
// ======================================

document.getElementById("department")
.addEventListener("change", async function() {

    const departmentId = this.value;

    if (!departmentId) return;

    try {

        const response = await fetch(
            `http://127.0.0.1:8001/auth/departments/${departmentId}/doctors/`
        );

        const data = await response.json();

        console.log("DOCTORS:", data);

        const doctorSelect =
            document.getElementById("doctor");

        doctorSelect.innerHTML = `
            <option value="">
                Select Doctor
            </option>
        `;

        data.forEach(doctor => {

            const option =
                document.createElement("option");

            option.value = doctor.id;

            option.text =
                `${doctor.name} (${doctor.specialization})`;

            doctorSelect.appendChild(option);
        });

    }

    catch(error) {

        console.log("Doctor Error:", error);
    }
});



// ======================================
// LOAD SLOTS FUNCTION
// ======================================

async function loadSlots() {

    const doctorId =
        document.getElementById("doctor").value;

    const date =
        document.getElementById("date").value;

    if (!doctorId || !date) {

        return;
    }

    try {

        const response = await fetch(
            `http://127.0.0.1:8001/auth/doctor/${doctorId}/slots/?date=${date}`
        );

        const data = await response.json();

        console.log("SLOTS:", data);

        const timeSelect =
            document.getElementById("time");

        timeSelect.innerHTML = `
            <option value="">
                Select Time Slot
            </option>
        `;

        // NO SLOTS

        if (!data.available_slots ||
            data.available_slots.length === 0) {

            const option =
                document.createElement("option");

            option.text =
                "No slots available";

            option.disabled = true;

            timeSelect.appendChild(option);

            return;
        }

        // LOAD SLOTS

        data.available_slots.forEach(slot => {

            const option =
                document.createElement("option");

            option.value = slot;

            option.text = slot;

            timeSelect.appendChild(option);
        });

    }

    catch(error) {

        console.log("Slot Error:", error);
    }
}



// ======================================
// DATE CHANGE
// ======================================

document.getElementById("date")
.addEventListener("change", loadSlots);



// ======================================
// DOCTOR CHANGE
// ======================================

document.getElementById("doctor")
.addEventListener("change", async function() {

    const date =
        document.getElementById("date").value;

    if (date) {

        loadSlots();
    }
});




// ======================================
// BOOK APPOINTMENT
// ======================================

document.getElementById("bookingForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const token =
        localStorage.getItem("access_token");

    console.log("BOOKING TOKEN:", token);

    // LOGIN CHECK

    if (!token) {

        showToast(
            "Please login as patient first",
            "error"
        );

        document.getElementById("message")
        .className =
            "mt-4 text-red-600 font-semibold";

        document.getElementById("message")
        .innerText =
            "Please login as patient first";

        return;
    }

    try {

        const response = await fetch(
            "http://127.0.0.1:8001/auth/appointments/book/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({

                    doctor:
                        document.getElementById("doctor").value,

                    appointment_date:
                        document.getElementById("date").value,

                    appointment_time:
                        document.getElementById("time").value,

                    reason:
                        document.getElementById("reason").value
                })
            }
        );

        const data =
            await response.json();

        console.log(
            "BOOKING RESPONSE:",
            data
        );



        // SUCCESS

        if (response.ok) {

            console.log(
                "✅ Appointment booked successfully"
            );

            showToast(
                data.message ||
                "Appointment booked successfully",
                "success"
            );

            document.getElementById("message")
            .className =
                "mt-4 text-green-600 font-semibold";

            document.getElementById("message")
            .innerText =
                data.message ||
                "Appointment booked successfully";

            document.getElementById("bookingForm")
            .reset();

            // RESET SLOT DROPDOWN

            document.getElementById("time")
            .innerHTML = `
                <option value="">
                    Select Time Slot
                </option>
            `;
        }



        // ERROR

        else {

            console.log(
                "❌ Booking Failed"
            );

            const errorMessage =

                data.error ||
                data.detail ||
                JSON.stringify(data) ||
                "Booking failed";

            showToast(
                errorMessage,
                "error"
            );

            document.getElementById("message")
            .className =
                "mt-4 text-red-600 font-semibold";

            document.getElementById("message")
            .innerText =
                errorMessage;
        }

    }

    catch(error) {

        console.log(
            "Booking Error:",
            error
        );

        showToast(
            "Server error",
            "error"
        );

        document.getElementById("message")
        .className =
            "mt-4 text-red-600 font-semibold";

        document.getElementById("message")
        .innerText =
            "Server error";
    }

});

</script>

</body>
</html>
