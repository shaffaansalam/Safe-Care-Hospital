<script>

const token = localStorage.getItem("access_token");


// =======================================
// LOAD DEPARTMENTS
// =======================================

async function loadDepartments() {

    const response = await fetch(
        "http://127.0.0.1:8001/auth/departments/dropdown/"
    );

    const data = await response.json();

    const departmentSelect =
        document.getElementById("department");

    data.forEach(dept => {

        const option =
            document.createElement("option");

        option.value = dept.id;
        option.text = dept.name;

        departmentSelect.appendChild(option);
    });
}

loadDepartments();


// =======================================
// LOAD DOCTORS
// =======================================

document.getElementById("department")
.addEventListener("change", async function() {

    const departmentId = this.value;

    const response = await fetch(
        `http://127.0.0.1:8001/auth/departments/${departmentId}/doctors/`
    );

    const data = await response.json();

    const doctorSelect =
        document.getElementById("doctor");

    doctorSelect.innerHTML =
        `<option value="">Select Doctor</option>`;

    data.forEach(doctor => {

        const option =
            document.createElement("option");

        option.value = doctor.id;

        option.text =
            `${doctor.name} (${doctor.specialization})`;

        doctorSelect.appendChild(option);
    });
});


// =======================================
// LOAD AVAILABLE SLOTS
// =======================================

document.getElementById("date")
.addEventListener("change", async function() {

    const doctorId =
        document.getElementById("doctor").value;

    const date = this.value;

    const response = await fetch(
        `http://127.0.0.1:8001/auth/doctor/${doctorId}/slots/?date=${date}`
    );

    const data = await response.json();

    const timeSelect =
        document.getElementById("time");

    timeSelect.innerHTML =
        `<option>Select Time Slot</option>`;

    data.available_slots.forEach(slot => {

        const option =
            document.createElement("option");

        option.value = slot;
        option.text = slot;

        timeSelect.appendChild(option);
    });
});


// =======================================
// BOOK APPOINTMENT
// =======================================

document.getElementById("bookingForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const response = await fetch(
        "http://127.0.0.1:8001/auth/appointments/book/",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },

            body: JSON.stringify({

                doctor:
                    document.getElementById("doctor").value,

                appointment_date:
                    document.getElementById("date").value,

                appointment_time:
                    document.getElementById("time").value,

                reason:
                    document.getElementById("reason").value
            })
        }
    );

    const data = await response.json();

    document.getElementById("message")
        .innerText = data.message || data.error;
});

</script>
